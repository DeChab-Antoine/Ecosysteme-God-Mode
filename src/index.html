<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Exoplanet God Mode</title>
    <style>
      body { margin: 0; background: rgb(0, 0, 0); height: 100vh; }
      #layout {
        display: flex;
        height: 100vh;
        align-items: flex-start;
        gap: 12px;
        padding: 12px;
        box-sizing: border-box;
      }
      canvas { 
        image-rendering: pixelated; 
        background: rgb(255, 255, 255); 
        width: 960px;
        height: 720px;
        display: block;
      }

      #stats {
        width: 320px;
        border: 2px solid black;
        padding: 10px;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        background: #fff;
        height: fit-content;
        max-height: calc(100vh - 24px);
        overflow: auto;
      }
      #stats h3 { 
        margin: 0 0 8px 0;
        font-size: 25px; 
      }
      #statsSummary { 
        margin: 0 0 8px 0; 
        font-size: 20px;
      }

      #hud {
        position: absolute;
        top: 12px;
        right: 12px;

        width: 360px;
        padding: 12px;

        background: rgba(0, 0, 0, 0.35);
        border-radius: 12px;
        color: white;

        display: flex;
        flex-direction: column;
        gap: 12px;  
      }

      #stats {
        font-family: monospace;
        font-size: 14px;
      }

      #popChart {
        width: 100%;
        height: 160px;
      }
    </style>

  </head>
  <body>
    <div id="layout">
      <canvas id="game"></canvas>

      <div id="stats">
        <h3>Stats</h3>
        <pre id="statsSummary"></pre>

        <div id="chartWrap">
          <canvas id="popChartAliens"></canvas>
          <canvas id="popChartBlobs"></canvas>
        </div>
      </div>
    </div>
    <script src="https://cdn.babylonjs.com/babylon.js"></script>
    <script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <script type="module" src="./main.js"></script>
  </body>
</html>
